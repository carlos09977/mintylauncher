name: Crear APK Android

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Descomprimir el proyecto
      run: unzip MintyLauncher.zip -d proyecto_android

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar el APK
      run: |
        # Busca la carpeta real dentro del zip y entra
        cd $(dirname $(find proyecto_android -name gradlew | head -n 1))
        
        # Le da permisos y compila tu app
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # Saca el APK para que lo puedas descargar
        cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/MintyLauncher-Listo.apk

    - name: Guardar el APK listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: MintyLauncher-APK
        path: MintyLauncher-Listo.apk
